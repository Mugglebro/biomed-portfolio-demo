      type: "html_list"
      source_kind: "primary"
      region: "中国"
      language: "中文"
      category: "上市公司公告/港交所"
      url: "https://www1.hkexnews.hk/search/titlesearch.xhtml?lang=ZH&market=SEHK&category=0"
      link_include_patterns:
