editorial_profile:
  name: "中文创新药产业情报"
  reference_accounts:
    - 新药创始人
    - 医药魔方
    - 思齐俱乐部
    - 动脉网
    - 氨基观察
    - E药经理人
    - 猎药人俱乐部
    - 谈思生物
  priority_topics:
    - 中国创新药
    - NMPA / CDE
    - BD / 授权 / 出海
    - 融资并购
    - ADC / 双抗 / 细胞治疗等产业事件
    - 商业化 / 医保 / 集采
    - 上市公司公告
  event_required_for_top: true
  preferred_event_types:
    - 审评审批
    - BD交易
    - 融资并购
    - 商业化政策
    - 上市公司公告
    - 产业事件
  downgrade_topics:
    - 会议通知
    - 招商活动
    - 地方宣传
    - 纯股价波动
    - 榜单申报
    - 无明确研发或商业化信息的泛产业报道
    - 报告发布
    - 趋势解读
    - 观点评论
    - 沙龙/会议回顾

fields:
  aliases:
    id: ["id", "ID", "编号", "序号"]
    title: ["title", "标题", "资讯标题"]
    source: ["source", "来源", "信息来源", "媒体来源"]
    url: ["url", "URL", "链接", "原文链接", "来源链接"]
    published_date: ["published_date", "发布时间", "发布日期", "发表时间"]
    collected_date: ["collected_date", "收集时间", "采集时间", "录入时间"]
    language: ["language", "语言"]
    region: ["region", "地区", "国家/地区"]
    category: ["category", "类别", "分类"]
    summary_cn: ["summary_cn", "中文摘要", "摘要", "一句话摘要"]
    key_entities: ["key_entities", "关键实体", "相关公司/机构", "实体"]
