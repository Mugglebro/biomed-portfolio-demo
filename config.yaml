excel:
  sheet_name: "资讯库"
  backup_before_write: true
  backup_dir: "backups"
  clear_push_today_after_send: false

fetch:
  enabled: false
  days_back: 7
  preferred_days: 3
  max_items_per_source: 20
  create_excel_if_missing: true
  include_archived: true
  require_direct_article_link: true
  request_timeout_seconds: 15
  request_retries: 2
  google_decode_timeout_seconds: 8
  sources:
    - name: "FDA Press Releases"
      enabled: false
      source_kind: "primary"
      region: "美国"
      language: "英文"
      category: "监管/医药新闻"
      url: "https://www.fda.gov/about-fda/contact-fda/stay-informed/rss-feeds/press-releases/rss.xml"
    - name: "EMA News and Press Releases"
      enabled: false
      source_kind: "primary"
      region: "欧洲"
      language: "英文"
      category: "监管/医药新闻"
      url: "https://www.ema.europa.eu/en/news.xml"
    - name: "NIH News Releases"
      enabled: false
      source_kind: "primary"
      region: "美国"
      language: "英文"
      category: "生物医学研究"
      url: "https://www.nih.gov/news-releases/feed.xml"
    - name: "PR Newswire Biotechnology"
      enabled: false
      source_kind: "primary"
      region: "全球"
      language: "英文"
      category: "一级新闻稿/生物技术"
      url: "https://www.prnewswire.com/rss/health-latest-news/biotechnology-list.rss"
    - name: "PR Newswire Pharmaceuticals"
      enabled: false
      source_kind: "primary"
      region: "全球"
      language: "英文"
      category: "一级新闻稿/制药"
      url: "https://www.prnewswire.com/rss/health-latest-news/pharmaceuticals-list.rss"
    - name: "PR Newswire Clinical Trials"
      enabled: false
      source_kind: "primary"
      region: "全球"
      language: "英文"
      category: "一级新闻稿/临床试验"
      url: "https://www.prnewswire.com/rss/health-latest-news/clinical-trials-medical-discoveries-list.rss"
    # 以下为官方原始来源的轻量解析器配置位。当前先默认关闭：
    # CDE 页面有前端加密/动态渲染，NMPA 在本地直连返回 412，港交所标题检索依赖表单接口。
    # 后续逐个做专用适配器时，可把 enabled 改为 true。
    - name: "CDE 优先审评公示"
      enabled: false
      type: "html_list"
      source_kind: "primary"
      region: "中国"
      language: "中文"
      category: "官方公告/CDE"
      url: "https://www.cde.org.cn/main/xxgk/listpage/2f78f372d351c6851af7431c7710a731"
      link_include_patterns:
        - "/main/xxgk/"
        - "/main/news/"
      title_include_keywords:
        - 优先审评
        - 突破性治疗
        - 上市申请
        - IND
        - 受理
    - name: "NMPA 药品公告"
      enabled: false
      type: "html_list"
      source_kind: "primary"
      region: "中国"
      language: "中文"
      category: "官方公告/NMPA"
      url: "https://www.nmpa.gov.cn/xxgk/ggtg/ypggtg/index.html"
      link_include_patterns:
        - "/xxgk/"
        - "/yaopin/"
      title_include_keywords:
        - 批准
        - 获批
        - 上市
        - 药品
        - 附条件
    - name: "港交所医药上市公司公告"
