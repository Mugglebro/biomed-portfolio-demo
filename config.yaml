mail:
  enabled: true
  dry_run: true
  subject_prefix: "【生物医药产业资讯简报】"
  use_html: true
  attach_pushed_excel: true

feedback:
  enabled: true
  collect_from_mail: false
  mail_scan_days: 30
  pop3_scan_messages: 200
  public_portal_enabled: true
  local_portal_enabled: false
  local_portal_port: 8765

dedup:
  use_url: true
  use_title_similarity: true
  title_similarity_threshold: 0.9
  keep: "highest_score"

output:
  output_dir: "outputs"
  save_text: true
  save_html: true
  save_daily_excel_snapshot: true
  daily_excel_prefix: "auto_news_cn"
