name: Deploy Portfolio Demos

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web_app/package-lock.json

      - name: Build BioEvent app
        working-directory: web_app
        env:
          NEXT_PUBLIC_BASE_PATH: /biomed-portfolio-demo/bioevent
        run: |
          npm ci
          npm run build

      - name: Assemble Pages artifact
        shell: bash
        run: |
          mkdir -p site/med-desk site/bioevent
          rsync -a --exclude='.git' --exclude='.github' --exclude='output' public_demo/ site/med-desk/
          cp -R web_app/out/. site/bioevent/
          cp pages-home/index.html site/index.html
          touch site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
